[project]
name = "water-billkiv-rateio"
version = "0.1.0"
description = "Sistema de rateio de água com Kivy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kivy>=2.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "supabase>=2.31.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "types-reportlab>=4.5.1.20260724",
]
